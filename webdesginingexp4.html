<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Room Booking Form</title>
</head>
<body>

    <h2 align="center">Hotel Room Booking Form</h2>

    <form align="center">
        <p>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname">
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </p>

        <p>
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone">
        </p>

        <p>
            <label for="checkin">Check-in Date:</label>
            <input type="date" id="checkin" name="checkin" placeholder="dd-mm-yyyy">
        </p>

        <p>
            <label for="checkout">Check-out Date:</label>
            <input type="date" id="checkout" name="checkout" placeholder="dd-mm-yyyy">
        </p>

        <p>
            <label for="roomtype">Room Type:</label>
            <select id="roomtype" name="roomtype">
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="suite">Suite</option>
            </select>
        </p>

        <p>
            <label for="guests">Number of Guests:</label>
            <input type="number" id="guests" name="guests">
        </p>

        <p>
            <label for="requests">Special Requests:</label><br>
            <textarea id="requests" name="requests" rows="4" cols="40"></textarea>
        </p>

        <p>
            <button type="submit">Book Now</button>
            <button type="reset">Reset Form</button>
        </p>
    </form>

</body>
</html>
